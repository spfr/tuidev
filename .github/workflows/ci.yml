name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Shellcheck — every shell file under our control.
  # ---------------------------------------------------------------------------
  lint-scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # The file list lives in the Makefile, so local `make lint` and CI agree.
      # shellcheck also parses every file, which is why there is no bash -n job.
      - run: make lint

  # ---------------------------------------------------------------------------
  # Config syntax: JSON, TOML, Lua (luac -p), shell — one validator, strict.
  # ---------------------------------------------------------------------------
  validate-configs:
    name: validate configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install validators
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4
      - run: scripts/validate_configs.sh --strict

  # ---------------------------------------------------------------------------
  # No hardcoded user paths leaked into shipped configs or scripts.
  # ---------------------------------------------------------------------------
  check-paths:
    name: no hardcoded paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: grep for hardcoded user paths and personal mDNS hosts
        run: |
          set -euo pipefail
          failed=0
          roots=(configs scripts bin templates .github install.sh uninstall.sh Makefile Dockerfile docs README.md VISION.md CLAUDE.md AGENTS.md CONTRIBUTING.md SECURITY.md CHANGELOG.md)

          # Placeholder spellings docs use to *describe* the rule rather than
          # violate it — including the mDNS examples in docs/remote.md.
          filter_placeholders() {
            grep -vE '/Users/NAME|/home/NAME|/Users/username|/home/username|@(hostname|HOSTNAME|host|machine|example|your-[A-Za-z0-9-]+)\.local\b' || true
          }

          # scan LABEL PATTERN [EXTRA_EXCLUDE_PATTERN]
          # Matches are captured ONCE and reused for both the test and the
          # printed list. The old form piped grep into `grep -q .`, which exits
          # on the first match and SIGPIPEs the upstream grep (141); under
          # `pipefail` that made the pipeline non-zero, so beyond a few thousand
          # matching lines the check silently "passed" while violations existed.
          scan() {
            local label="$1" pattern="$2" extra="${3:-}"
            local hits
            hits="$(grep -rE "$pattern" "${roots[@]}" 2>/dev/null | grep -v '/\.git/' || true)"
            if [[ -n "$extra" ]]; then
              hits="$(printf '%s\n' "$hits" | grep -vE "$extra" || true)"
            fi
            hits="$(printf '%s\n' "$hits" | filter_placeholders | grep -v '^[[:space:]]*$' || true)"
            if [[ -n "$hits" ]]; then
              echo "✗ $label"
              printf '%s\n' "$hits"
              failed=1
            fi
            return 0
          }

          scan "hardcoded /Users/USER path found" '/Users/[a-zA-Z0-9_-]+/'
          scan "hardcoded /home/USER path found"  '/home/[a-zA-Z0-9_-]+/' 'testuser'
          # user@hostname.local mDNS — do not ban ~/.local/bin or config.local
          scan "personal mDNS host (user@ + hostname) found — keep those in gitignored *.local overlays" \
               '@[A-Za-z0-9._-]+\.local\b'

          if [[ "$failed" -eq 0 ]]; then
            echo "✓ clean"
          fi
          exit "$failed"

  # ---------------------------------------------------------------------------
  # Config-file presence: the files install.sh references must exist.
  # ---------------------------------------------------------------------------
  required-files:
    name: required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          required=(
            install.sh
            Makefile
            configs/zsh/.zshrc
            configs/starship/starship.toml
            configs/tmux/tmux.conf
            configs/ghostty/config
            configs/ssh/config
            configs/claude/settings.json
            configs/codex/config.toml
            configs/opencode/opencode.json
            configs/opencode/tui.json
            configs/sandbox/profiles/strict.sb
            configs/sandbox/profiles/standard.sb
            configs/sandbox/profiles/off.sb
            bin/sbx
            scripts/lib/ui.sh
            scripts/lib/config_write.sh
            scripts/lib/migrate.sh
            scripts/lib/manifest.sh
            scripts/lib/pkg.sh
            scripts/lib/packs.sh
            scripts/lib/profile.sh
            docs/updating.md
            scripts/notify.sh
            scripts/health_check.sh
            scripts/test_suite.sh
            scripts/update.sh
            configs/themes/tokyo-night/palette.toml
            configs/themes/catppuccin-mocha/palette.toml
            scripts/theme.sh
            docs/sandboxing.md
            docs/profiles.md
            docs/remote.md
            docs/theming.md
            docs/roadmap.md
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ -e "$f" ]]; then
              echo "✓ $f"
            else
              echo "✗ $f  (missing)"
              missing=1
            fi
          done
          exit $missing

  # ---------------------------------------------------------------------------
  # Seatbelt profiles parse on the macOS runner.
  # ---------------------------------------------------------------------------
  seatbelt-profiles:
    name: macOS (seatbelt + bash 3.2)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each profile parses twice: as is, and with the opt-in herdr branch on.
      # `|| exit 1` per call, so any failure fails the step (not just the last).
      - name: parse each .sb
        run: |
          for p in configs/sandbox/profiles/*.sb; do
            sandbox-exec -f "$p" -D HOME_DIR="$HOME" -D PROJECT_DIR="$PWD" -- \
              /usr/bin/true || exit 1
            sandbox-exec -f "$p" -D HOME_DIR="$HOME" -D PROJECT_DIR="$PWD" -D ALLOW_HERDR=1 -- \
              /usr/bin/true || exit 1
            echo "✓ $p"
          done
      - name: smoke-test sbx wrapper
        run: |
          chmod +x bin/sbx
          ./bin/sbx --help | head -5
          ./bin/sbx --dry-run -- echo hello
          echo "✓ sbx executes"
      # Stock macOS bash is 3.2; every script must run under it.
      - name: lib tests under /bin/bash 3.2
        run: for t in scripts/lib/test_*.sh; do /bin/bash "$t" || exit 1; done
      - name: install dry-run (desktop)
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          /bin/bash ./install.sh --profile desktop --dry-run < /dev/null

  # ---------------------------------------------------------------------------
  # scripts/lib/ unit tests + cross-file contract checks.
  # ---------------------------------------------------------------------------
  lib-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tmux lets test_theme.sh load the shipped tmux.conf on a private server.
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: scripts/lib harnesses
        run: for t in scripts/lib/test_*.sh; do echo "::group::$t"; bash "$t" || exit 1; echo "::endgroup::"; done
      - name: install dry-run (minimal, remote)
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          ./install.sh --profile minimal --dry-run < /dev/null
          ./install.sh --profile remote --dry-run < /dev/null

  # ---------------------------------------------------------------------------
  # Alpine container smoke test for the core pack. UI tests are skipped here.
  # ---------------------------------------------------------------------------
  docker-core:
    name: docker core-tag test
    runs-on: ubuntu-latest
    # The runner ships podman too; pin docker so the job tests what its name says.
    env:
      TUIDEV_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same entry point developers use locally.
      - name: build
        run: ./scripts/container.sh build
      - name: run core tests
        run: ./scripts/container.sh test bash -c "./scripts/test_suite.sh --tag core"
      - name: cleanup
        if: always()
        run: ./scripts/container.sh clean

  # ---------------------------------------------------------------------------
  # Doc link + presence check.
  # ---------------------------------------------------------------------------
  check-docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check_links.sh

  # ---------------------------------------------------------------------------
  # Aggregate result.
  # ---------------------------------------------------------------------------
  summary:
    name: summary
    runs-on: ubuntu-latest
    needs:
      - lint-scripts
      - validate-configs
      - check-paths
      - required-files
      - seatbelt-profiles
      - lib-tests
      - docker-core
      - check-docs
    if: always()
    steps:
      # The required status check: fails if any job failed or was cancelled.
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI checks passed."
