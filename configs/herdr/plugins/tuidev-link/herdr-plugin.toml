# tuidev's Herdr plugin, linked by `tuidev install --pack herdr`.
#
# A plugin runs on the machine that owns the pane. On a machine you are
# attached to from another one, a Ctrl-click on a localhost URL (or on a file
# link an agent printed) is passed to that other machine, which opens it: the
# URL through an ssh tunnel, the file fetched (`agents link`, docs/remote.md).
# With nobody attached, the click opens here, as it would without the plugin.
#
# The board (prefix+space) is every session on every machine in one list, by
# what you would do about it, over the pane you work in: enter goes to one,
# esc puts you back (`agents board`, docs/agent-workflows.md). prefix+shift+space
# opens it as a tab, to leave open, or goes back to the one that is open.
#
# The palette (prefix+a) lists what tuidev can do here, searchable, and runs
# the one you pick (`tuidev palette`); Updates (prefix+u) says which release
# is installed and which is out, and asks before it updates (`tuidev update
# --ask`). Both need only the tuidev command, which every install has.
#
# Its event hooks keep Herdr's labels saying what runs where (`agents herdr
# sync`: tab names, the sidebar's $tuidev_agents roll-up, agent rows' marks), and
# reload an open board (`agents board --poke`). Herdr
# runs each hook on its own server, so every machine names its own tabs.
id = "tuidev.link"
name = "tuidev link"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "A board of every session on every machine, by who needs you; a palette of everything tuidev can do; what runs where and one key to stop it; tabs named after what runs in them; links from another machine's panes opened on the machine you sit at; tuidev's own updates."
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open link on my machine"
command = ["sh", "run.sh", "click"]

[[actions]]
id = "board"
title = "Board: every session, by who needs you"
command = ["sh", "run.sh", "board"]

[[actions]]
id = "board-tab"
title = "Board, as a tab to leave open"
command = ["sh", "run.sh", "board-tab"]

[[actions]]
id = "map"
title = "Map: what runs where, and stop it"
command = ["sh", "run.sh", "map"]

[[actions]]
id = "ports"
title = "Ports: what listens where"
command = ["sh", "run.sh", "ports"]

[[actions]]
id = "palette"
title = "Palette: everything tuidev can do"
command = ["sh", "run.sh", "palette"]

[[actions]]
id = "update"
title = "Updates: the installed release and the latest"
command = ["sh", "run.sh", "update"]

[[panes]]
id = "board"
title = "Board"
placement = "popup"
width = "94%"
height = "92%"
command = ["sh", "run.sh", "board-pane"]

[[panes]]
id = "board-tab"
title = "Board"
placement = "tab"
command = ["sh", "run.sh", "board-tab-pane"]

[[panes]]
id = "palette"
title = "tuidev"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "run.sh", "palette-pane"]

[[panes]]
id = "update"
title = "tuidev update"
placement = "popup"
width = "80%"
height = "70%"
command = ["sh", "run.sh", "update-pane"]

[[panes]]
id = "map"
title = "Map"
placement = "popup"
width = "92%"
height = "90%"
command = ["sh", "run.sh", "map-pane"]

[[panes]]
id = "ports"
title = "Ports"
placement = "popup"
width = "80%"
height = "70%"
command = ["sh", "run.sh", "ports-pane"]

[[link_handlers]]
id = "localhost"
title = "Open on my machine"
pattern = "^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\])(:[0-9]+)?(/.*)?$"
action = "open"

[[link_handlers]]
id = "file"
title = "Open file on my machine"
pattern = "^file://"
action = "open"

# What changes a tab's name or a workspace's roll-up: a tab, pane or agent
# coming or going or moving, and an agent changing state (its task title is
# set by then). Herdr offers no hook on a title or directory change alone
# (pane.updated is not a hook event); the next of these, or the menu bar's
# refresh, catches it. A burst of them costs one sync and one more pass.
# An agent coming, going or changing state also refreshes the menu bar
# (sync-poke): that is how it hears of codex, grok and agy sessions here,
# which have no hooks of their own.
[[startup]]
command = ["sh", "run.sh", "startup"]

[[events]]
on = "tab.created"
command = ["sh", "run.sh", "sync"]

[[events]]
on = "tab.closed"
command = ["sh", "run.sh", "sync"]

[[events]]
on = "tab.moved"
command = ["sh", "run.sh", "sync"]

[[events]]
on = "tab.focused"
command = ["sh", "run.sh", "sync"]

[[events]]
on = "pane.created"
command = ["sh", "run.sh", "sync"]

[[events]]
on = "pane.closed"
command = ["sh", "run.sh", "sync-poke"]

[[events]]
on = "pane.moved"
command = ["sh", "run.sh", "sync"]

[[events]]
on = "pane.exited"
command = ["sh", "run.sh", "sync-poke"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "run.sh", "sync-poke"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "run.sh", "sync-poke"]
