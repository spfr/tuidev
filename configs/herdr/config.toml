# tuidev defaults for Herdr (opt-in --pack herdr).
# Dropped in only when ~/.config/herdr/config.toml is absent (--adopt-existing).
#
# Prefix stays the Herdr default (ctrl+b) so it does not clash with tmux
# in this setup (ctrl+a). Do not nest `herdr` inside a Herdr pane
# (HERDR_ENV=1). See docs/agent-workflows.md.

[theme]
name = "tokyo-night"

[ui]
# Who needs you first: blocked agents lead the panel, with a shape for each
# state, as in `agents` and the menu.
agent_panel_sort = "priority"
status_indicators = "symbols"
