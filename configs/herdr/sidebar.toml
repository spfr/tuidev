# tuidev's sidebar rows for Herdr, laid out for a 26-column sidebar: Herdr
# shortens every token on a line that runs over, so each line keeps to what
# fits. A workspace row: its name, then in red how many agents there are
# blocked on you ($need); below, the branch and what runs there ($agents:
# "✳2 ❯1", two Claude Code sessions and a shell). An agent row, like a mail
# list: the tab's name (what the session is doing), the session's own task
# title when the tab's name does not say it ($session), the agent only when
# no mark names it already, the machine unless it is Local, and when its
# state began ($since); below, the state in words (blocked in red, done in
# blue, the rest dim) and the workspace. The $ tokens come from `agents herdr
# sync` (--pack monitoring); without it they are not shown.
# For rows of your own, delete this whole block, markers too, and write yours:
# a second [ui.sidebar.spaces] or [ui.sidebar.agents] table would be a TOML
# error, so the installer skips this block while your config has either. Keep
# your own settings above this block: TOML has no way to close a table, so
# whatever follows lands in the last one.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", { token = "$need", fg = "#e5484d", bold = true }],
  ["branch", "git_status", "$agents"],
]

[ui.sidebar.agents]
rows = [
  [
    "state_icon",
    { token = "tab", bold = true, dim = false },
    "$session",
    { token = "agent", rules = [{ contains = " ", hide = true }] },
    { token = "machine", rules = [{ equals = "Local", hide = true }] },
    { token = "$since", dim = true },
  ],
  [
    { token = "state_text", dim = true, rules = [
      { equals = "blocked", fg = "#e5484d", bold = true, dim = false },
      { equals = "done", fg = "#3b82f6", dim = false },
      { equals = "unknown", hide = true },
    ] },
    { token = "workspace", bold = false, dim = true },
  ],
]
