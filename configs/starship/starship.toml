# ============================================================================
# Starship Prompt Configuration
# Optimized for AI development workflows
# ============================================================================

# Color source: scripts/theme.sh writes a [palettes.tuidev] table as a managed
# block. Until a theme is applied this reference is inert (starship falls back
# to default colors silently).
palette = "tuidev"

format = """
[╭─](bold green)$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$rust\
$golang\
$java\
$docker_context\
$cmd_duration
[╰─](bold green)$character"""

# Only modules named in `format` render; configure nothing else here.

# Timeout for starship to scan files
scan_timeout = 30
command_timeout = 500

# ============================================================================
# Prompt Components
# ============================================================================

[username]
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
format = "[@$hostname](bold blue) "

[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " 🔒"
read_only_style = "red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"workspace" = " "
"projects" = " "

# ============================================================================
# Git Integration
# ============================================================================

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold purple"
truncation_length = 20
truncation_symbol = "…"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = ""
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = ""
modified = "!"
staged = "+"
renamed = ""
deleted = ""

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

# ============================================================================
# Language & Runtime Indicators
# ============================================================================

[python]
symbol = " "
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
style = "yellow bold"
pyenv_version_name = false
detect_extensions = []
detect_files = []
detect_folders = []

[nodejs]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold green"
detect_extensions = ["js", "mjs", "cjs", "ts"]
detect_files = ["package.json", ".node-version"]

[rust]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold red"

[golang]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "bold cyan"

[java]
symbol = " "
format = "via [$symbol($version )]($style)"
style = "red dimmed"

# ============================================================================
# Containers
# ============================================================================

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "blue bold"
only_with_files = true
detect_extensions = ["dockerfile"]
detect_files = ["docker-compose.yml", "Dockerfile"]

# ============================================================================
# Command Execution
# ============================================================================

[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"
