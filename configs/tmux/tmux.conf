# ============================================================================
# tmux Configuration - Tokyo Night Theme
# ============================================================================
# Installed by --pack tmux (part of --profile remote) as the tuidev-tmux
# managed block. Durable sessions: `t NAME` attaches or creates, `tls` lists.
# ============================================================================

# ============================================================================
# Prefix Key
# ============================================================================

# Use Ctrl+a (ergonomic, familiar from screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ============================================================================
# True Color & Terminal
# ============================================================================

set-option -g default-terminal "tmux-256color"
# 24-bit color from the outer terminal. Ghostty sets TERM=xterm-ghostty (named
# explicitly so it survives any narrowing of the generic pattern); xterm*
# covers the rest (xterm-256color, xterm-kitty, ...).
set-option -as terminal-features ',xterm-ghostty:RGB'
set-option -as terminal-features ',xterm*:RGB'

# Agent CLIs (Claude Code's documented tmux block): pass OSC notifications and
# progress through to the outer terminal, and keep Shift+Enter as a newline.
# xterm*:extkeys also matches xterm-ghostty. csi-u is the modified-key form
# (e.g. Shift+Enter as ^[[13;2u) that modern TUI libraries parse; tmux's
# default, xterm, is the older modifyOtherKeys form. The option is tmux 3.5+,
# so -q keeps older tmux (Debian/Ubuntu LTS) from reporting a config error.
set-option -g allow-passthrough on
set-option -s extended-keys on
set-option -sq extended-keys-format csi-u
set-option -as terminal-features 'xterm*:extkeys'

# ============================================================================
# General Settings
# ============================================================================

# Mouse support
set-option -g mouse on

# Base index 1 (windows and panes start at 1)
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when one is closed
set-option -g renumber-windows on

# Increase scrollback buffer
set-option -g history-limit 50000

# Focus events for Neovim autoread
set-option -g focus-events on

# Activity monitoring
set-option -g monitor-activity on
set-option -g visual-activity off

# Bells: an agent CLI rings the bell when it finishes or needs input. Flag the
# window in the status bar when that happens in a window you are not looking
# at; no audible/visual bell on top.
set-option -g monitor-bell on
set-option -g bell-action other
set-option -g visual-bell off

# Killing the last window of a session switches to another session instead
# of dropping you out of tmux.
set-option -g detach-on-destroy off

# ============================================================================
# Vi Mode (matches Neovim muscle memory)
# ============================================================================

set-window-option -g mode-keys vi

# Copies reach the system clipboard on every platform: pbcopy on macOS,
# wl-copy/xclip on a Linux desktop, and OSC 52 (set-clipboard) when none of
# those exist — the case over SSH to a headless box, where the escape sequence
# rides back to the local terminal (Ghostty allows clipboard-write).
# copy-command is what every bare copy-pipe uses, so `y` and a mouse-drag
# selection (the default MouseDragEnd1Pane binding) share the same chain.
set-option -s set-clipboard on
set-option -s copy-command \
    "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; else cat >/dev/null; fi'"
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ============================================================================
# Key Bindings
# ============================================================================

# Pane splits (intuitive | and -)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind-key c new-window -c "#{pane_current_path}"

# Pane navigation: prefix + h/j/k/l (vi-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resize: prefix + H/J/K/L
bind-key H resize-pane -L 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key L resize-pane -R 5

# Reload config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# prefix + g: lazygit in a 90% popup, in the current pane's directory; the
# popup closes when lazygit exits. (g is unbound by default.) lazygit comes
# with --extras, so say so instead of flashing an empty popup.
bind-key g if-shell "command -v lazygit >/dev/null 2>&1" {
    display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
} {
    display-message "lazygit is not installed (./install.sh --extras)"
}

# prefix + s is already `choose-tree -Zs` (zoomed session tree) by default.

# ============================================================================
# Tokyo Night Status Bar
# ============================================================================

# Colors
TN_BG="#1a1b26"
TN_BG_DARK="#16161e"
TN_BG_HIGHLIGHT="#292e42"
TN_FG="#c0caf5"
TN_ACCENT="#7aa2f7"
TN_GREEN="#9ece6a"
TN_YELLOW="#e0af68"
TN_RED="#f7768e"
TN_CYAN="#7dcfff"

set-option -g status on
set-option -g status-interval 5
set-option -g status-position bottom
set-option -g status-justify left

# Status bar colors
set-option -g status-style "bg=${TN_BG},fg=${TN_FG}"

# Left: session name
set-option -g status-left-length 30
set-option -g status-left "#[bg=${TN_ACCENT},fg=${TN_BG},bold] #S #[bg=${TN_BG},fg=${TN_ACCENT}] "

# Right: date/time
set-option -g status-right-length 50
set-option -g status-right "#[fg=${TN_BG_HIGHLIGHT}]#[bg=${TN_BG_HIGHLIGHT},fg=${TN_FG}] %H:%M #[bg=${TN_BG_HIGHLIGHT},fg=${TN_ACCENT}]#[bg=${TN_ACCENT},fg=${TN_BG},bold] %d %b "

# Window status
set-window-option -g window-status-format "#[fg=${TN_FG}] #I:#W "
set-window-option -g window-status-current-format "#[bg=${TN_BG_HIGHLIGHT},fg=${TN_ACCENT},bold] #I:#W "
set-window-option -g window-status-activity-style "fg=${TN_YELLOW}"

# Pane borders
set-option -g pane-border-style "fg=${TN_BG_HIGHLIGHT}"
set-option -g pane-active-border-style "fg=${TN_ACCENT}"

# Message style
set-option -g message-style "bg=${TN_BG_HIGHLIGHT},fg=${TN_ACCENT}"
set-option -g message-command-style "bg=${TN_BG_HIGHLIGHT},fg=${TN_FG}"

# Mode (copy mode) highlight
set-window-option -g mode-style "bg=${TN_ACCENT},fg=${TN_BG}"

# Active theme, written by `make theme` / scripts/theme.sh (absent until one is
# applied; -q keeps that silent). It must stay ABOVE the TPM block: plugins
# such as tmux-continuum append their hooks to status-right when TPM runs, and
# a theme sourced after that would overwrite them.
source-file -q ~/.config/tmux/theme.conf

# ============================================================================
# Plugins (TPM) — durable sessions
# ============================================================================
# tmux is the durability layer for our workflow; the plugins below make
# sessions survive reboots and reconnects:
#   - tmux-resurrect:  prefix + Ctrl-s saves, prefix + Ctrl-r restores
#   - tmux-continuum:  saves automatically every 15 minutes and restores
#                      on tmux start
#
# tuidev bootstraps TPM automatically from install.sh (with --core): it clones
# TPM to ~/.config/tmux/plugins/tpm and installs the plugins below. The lines
# here are inert until TPM is present, so this config is safe to source anywhere.
#
# Manual setup, if you ever need it (idempotent):
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#   tmux source ~/.config/tmux/tmux.conf
#   prefix + I       (installs the plugins listed below)

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum: auto-save every 15 min, auto-restore on server start.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Resurrect: restore pane contents too. (No nvim session strategy: LazyVim
# does not write a Session.vim for resurrect to restore.)
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (must be the last line). No-op if TPM isn't installed.
if-shell '[ -f ~/.config/tmux/plugins/tpm/tpm ]' {
    run '~/.config/tmux/plugins/tpm/tpm'
}
