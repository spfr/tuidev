# ~/.config/agents.conf — settings for `agents` and its SwiftBar menu.
#
# Installed once by `./install.sh --pack monitoring` and never overwritten:
# this file is yours. Every line below is a commented-out default; uncomment
# and edit the ones you want. Run `agents config` to see what is in effect.
#
# Format: KEY=value, one per line; quotes are optional. The file is read, never
# run as a script: unknown keys and malformed values are reported and ignored.
# The same names set in the environment win over this file.

# --- Hogs: processes eating CPU (any owner) ----------------------------------

# Lifetime-average CPU% that makes a long-running process a hog...
# AGENTS_HOG_PCT=50
# ...once it has run this many minutes.
# AGENTS_HOG_MIN=30
# Current CPU% that makes a process outside any agent tree a hog.
# AGENTS_HOG_NOW=90
# How many hogs to list.
# AGENTS_HOG_TOP=5

# --- What sessions run ---------------------------------------------------------

# Minutes before a command a session runs (a tool shell) counts as long-running
# and needs a look.
# AGENTS_TOOL_LONG=20
# Commands listed under each session in `agents ls` (`agents ps` lists all).
# AGENTS_LS_TOOLS=5
# Minutes before a polling loop a session waits on (`until …; do sleep 5;
# done`) counts as stuck and needs a look, once it has run this long, unless
# the file it watches changed within that time. 0 = never.
# AGENTS_WAIT_STUCK=60

# --- Agents and cleanup --------------------------------------------------------

# Process names (argv[0] basenames) that count as agent sessions.
# AGENTS_NAMES="claude codex"
# Seconds between SIGTERM and SIGKILL when killing a tree.
# AGENTS_GRACE=3
# How often `agents awake agents` checks whether any agent still runs, in seconds.
# AGENTS_AWAKE_POLL=60

# --- Keep awake with the lid closed (macOS) -----------------------------------

# 1 (the default) offers "Lid closed too…" (1h, 3h, 8h) under Awake in the
# menu; 0 hides it. Each pick turns off sleep for the whole Mac (pmset
# disablesleep) after asking for your password, and is always time-boxed: that
# is the opt-in. A closed Mac in a bag can overheat, so a root guard turns lid
# sleep back on when the time is up, below the battery floor below (off AC),
# or when thermal pressure reaches heavy. `agents awake lid 3h` works whatever
# this says.
# AGENTS_LID=1
# The longest `awake lid` may run (30m, 3h, 8h...); longer requests are refused.
# AGENTS_LID_MAX=8h
# Battery % (off AC) below which the guard turns lid sleep back on.
# AGENTS_LID_MIN_BATTERY=20
# --- History and cleanup ------------------------------------------------------

# 1 (the default) keeps a local history in ~/.local/state/tuidev/agents: a
# CPU sample by job type each minute, a line per finished command and per
# cleanup. Names only, never command lines; nothing leaves this machine.
# `agents report` and `agents runs` read it.
# 0 records nothing.
# AGENTS_HISTORY=1
# Days of history to keep.
# AGENTS_HISTORY_DAYS=30
# A price file for the estimate in `agents report --view tokens` (USD per
# million tokens, one model per line; tuidev ships none: copy the template,
# configs/agents/agents-prices.example.tsv in the tuidev repo, and fill it in
# from the vendors' pricing pages). An absolute or ~/ path. Without the file,
# the report shows tokens only, never a made-up price.
# AGENTS_PRICES=~/.config/tuidev/agents-prices.tsv

# --- Job types: where the CPU goes --------------------------------------------

# Every process in an agent's tree counts toward one job: test, build, server,
# browser, mcp, agent (the CLIs), wait (polling loops) or other. A command and
# everything it starts share its job (go test and its test binaries are test).
# Each key below adds an extended regex (ERE) to that job's built-in patterns,
# matched against the command a session runs (or a process's command line).
# Quote it when it contains " #". Examples:
# AGENTS_JOB_TEST="(^| )(just|task) test( |$)"
# AGENTS_JOB_BUILD="(^| )(just|task) build( |$)"
# AGENTS_JOB_SERVER="(^| )foreman start( |$)"
# AGENTS_JOB_BROWSER="(^|/)my-headless-browser( |$)"
# AGENTS_JOB_MCP="(^|/)my-tools-server( |$)"
# 1 cleans up, without asking, only what is safe to: the leftovers of agent
# sessions that have ended, when a sample saw them under an agent (so it needs
# AGENTS_HISTORY=1; never a server or anything listening on a port: one an
# agent started for you may still be wanted; never a caffeinate without -t),
# and polling loops stuck for twice AGENTS_WAIT_STUCK reading a file that
# stayed quiet. Never a long command.
# The menu runs it at most once a minute; without the menu, run
# `agents reap --auto` from cron. Each cleanup is logged and notified.
# 0 (the default) only lists them under Needs you; `agents why PID` explains each.
# AGENTS_AUTO_REAP=0
# 1 (the default) lets the Claude Code cleanup hooks (`agents hook`, shipped in
# ~/.claude/settings.json) stop the background commands a subagent left running
# after handing back its report, and a cleared session's polling loops. Only
# tasks matched to their own process by its output file are touched. 0 turns
# them off.
# AGENTS_HOOK_REAP=1
# 1 logs each hook run (event, agent id, whether a handback was found, tasks,
# matches, dry run; never a command line) to hooks.log in the data directory,
# to check when the hooks fire on your machine. 0 (the default) logs nothing.
# AGENTS_HOOK_LOG=0

# 1 = don't ask Herdr for agent status.
# AGENTS_NO_HERDR=

# The terminal that `agents open-term` (and the menu's "Open agents watch")
# opens: auto, ghostty (1.2 or later), iterm, terminal, wezterm or kitty. auto picks
# the first installed of Ghostty 1.2+, iTerm, WezTerm and kitty, else Terminal.
# AGENTS_TERMINAL=auto

# --- Menu bar (SwiftBar, macOS) ------------------------------------------------

# What the title shows after the icon, in this order. Tokens:
#   count    number of agent sessions (hidden at 0)
#   cpu      machine CPU %          mem      memory used %
#   load     1-minute load average  battery  battery % (Macs with a battery)
#   thermal  thermal pressure, only when above nominal
#   awake    a cup while keep-awake is on
#   warn     a triangle when something needs a look (the icon is tinted anyway)
# Empty (AGENTS_BAR_TITLE=) shows the icon alone.
# AGENTS_BAR_TITLE="count awake"

# Menu sections, in this order. needs lists sessions Herdr reports as blocked
# (waiting for you), duplicate and long-running commands, and stuck polling
# loops; jobs ("Where the CPU goes") shows CPU by job type now and today's
# CPU-hours; needs, stale and hogs only appear when they have entries.
# AGENTS_BAR_SECTIONS="needs agents jobs stale hogs awake system"

# The title's SF Symbol (any name from Apple's SF Symbols app).
# AGENTS_BAR_ICON=terminal

# How many of the busiest processes the System section lists (0 = none).
# Processes already listed as hogs are skipped.
# AGENTS_BAR_TOP=3

# Refresh interval: 5s, 10s, 30s, 1m... One refresh costs 0.2-0.6 s of
# CPU, depending on load, so 10s or slower is plenty. SwiftBar reads it
# from the plugin's file name: re-run `./install.sh --pack monitoring`
# (or `make update-configs`)
# after changing it, and the pack renames the plugin to match.
# AGENTS_BAR_REFRESH=10s
