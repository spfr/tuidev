# ~/.config/agents.conf — settings for `agents` and its SwiftBar menu.
#
# Installed once by `./install.sh --pack monitoring` and never overwritten:
# this file is yours. Every line below is a commented-out default; uncomment
# and edit the ones you want. Run `agents config` to see what is in effect.
#
# Format: KEY=value, one per line; quotes are optional. The file is read, never
# run as a script: unknown keys and malformed values are reported and ignored.
# The same names set in the environment win over this file.

# --- Hogs: processes eating CPU (any owner) ----------------------------------

# Lifetime-average CPU% that makes a long-running process a hog...
# AGENTS_HOG_PCT=50
# ...once it has run this many minutes.
# AGENTS_HOG_MIN=30
# Current CPU% that makes a process outside any agent tree a hog.
# AGENTS_HOG_NOW=90
# ...held for this many minutes, so a brief spike is no hog. 0 = one reading is enough.
# AGENTS_HOG_SUSTAIN=3
# How many hogs to list.
# AGENTS_HOG_TOP=5

# --- Memory guard (`agents mem`) -----------------------------------------------

# kill: warn about, record and stop a runaway process in an agent tree; warn:
# only warn and record; off: neither. A LaunchAgent runs the guard on macOS,
# a systemd user service (tuidev-memguard.service) on Linux; after a change
# here, run `agents mem restart` (macOS) or
# `systemctl --user restart tuidev-memguard.service` (Linux).
# AGENTS_MEM_GUARD=kill
# GB of memory (footprint) that gets a process a warning, again at each
# doubling, and makes it a memory hog. The guard warns at this or at 60% of
# its stop size, the smaller.
# AGENTS_MEM_WARN=8
# GB at which a process in an agent tree (never the agent itself) is stopped;
# 0 = half the RAM. While memory pressure is critical, the largest one past
# the warning is stopped too.
# AGENTS_MEM_KILL=0
# MB/s of growth that gets a process one warning.
# AGENTS_MEM_RATE=200
# Seconds between the guard's looks while something needs watching (a process
# past half the warning, memory pressure, free memory falling fast).
# AGENTS_MEM_POLL=5
# Seconds between looks when nothing does (a minute with no agent session
# running). Clamped so a runaway growing 4x AGENTS_MEM_RATE still cannot get
# from half the warning to the stop size between two looks.
# AGENTS_MEM_IDLE=20

# --- What sessions run ---------------------------------------------------------

# Minutes before a command a session runs (a tool shell) counts as long-running
# and needs a look.
# AGENTS_TOOL_LONG=20
# Commands listed under each session in `agents ls` (`agents ps` lists all).
# AGENTS_LS_TOOLS=5
# Minutes before a polling loop a session waits on (`until …; do sleep 5;
# done`) counts as stuck and needs a look, once it has run this long, unless
# the file it watches changed within that time. 0 = never.
# AGENTS_WAIT_STUCK=60

# --- States: who needs you ------------------------------------------------------

# Minutes a finished session stays "to review" in `agents` and the menu before it
# counts as parked: most of the time sessions sit finished is in stretches past
# an hour. A session you looked at and left idle is parked at once.
# AGENTS_PARKED_MIN=60

# --- Colors ---------------------------------------------------------------------

# auto: the palette scripts/theme.sh applied, else the terminal's 16 colors.
# ansi: the 16 colors, always. none: no color (the states keep their shapes, as
# under NO_COLOR). Any other word: that palette (catppuccin-mocha, tokyo-night...).
# AGENTS_THEME=auto
# Any of the six colors, as a palette key or #rrggbb.
# AGENTS_COLOR_NEED=ansi_red
# AGENTS_COLOR_DONE=ansi_blue
# AGENTS_COLOR_RUN=ansi_green
# AGENTS_COLOR_WARN=ansi_yellow
# AGENTS_COLOR_ACCENT=accent
# Dim has no color by default: it is the terminal's own faint text (SGR 2). To
# name one:
# AGENTS_COLOR_DIM=fg_dim

# --- Agents and cleanup --------------------------------------------------------

# Process names (argv[0] basenames) that count as agent sessions: Claude Code,
# Codex, Antigravity, Grok and Cursor's CLI (which also counts when it runs as
# "agent", from its own install).
# AGENTS_NAMES="claude codex agy grok cursor-agent"
# Seconds between SIGTERM and SIGKILL when killing a tree.
# AGENTS_GRACE=3
# How often `agents awake agents` checks whether any agent still runs, in seconds.
# AGENTS_AWAKE_POLL=60

# --- Keep awake with the lid closed (macOS) -----------------------------------

# 1 (the default) offers "Lid closed too…" (1h, 3h, 8h) under Awake in the
# menu; 0 hides it. Each pick turns off sleep for the whole Mac (pmset
# disablesleep) after asking for your password, and is always time-boxed: that
# is the opt-in. A closed Mac in a bag can overheat, so a root guard turns lid
# sleep back on when the time is up, below the battery floor below (off AC),
# or when thermal pressure reaches heavy. `agents awake lid 3h` works whatever
# this says.
# AGENTS_LID=1
# The longest `awake lid` may run (30m, 3h, 8h...); longer requests are refused.
# AGENTS_LID_MAX=8h
# Battery % (off AC) below which the guard turns lid sleep back on.
# AGENTS_LID_MIN_BATTERY=20
# --- History and cleanup ------------------------------------------------------

# 1 (the default) keeps a local history in ~/.local/state/tuidev/agents: a
# CPU sample by job type each minute, a line per finished command and per
# cleanup, and the token use, compactions and denials the Claude Code and
# Codex transcripts record. Names only, never command lines; nothing leaves
# this machine. `agents report` and `agents runs` read it.
# 0 records nothing.
# AGENTS_HISTORY=1
# Days of history to keep.
# AGENTS_HISTORY_DAYS=30
# 1 (the default) lets the pack's sampler (a LaunchAgent on macOS,
# tuidev-sample.timer on Linux) take the history's sample once a minute,
# whether or not the menu bar runs; a run finds a sample the menu or
# `agents watch` took within 55 s and does nothing. 0 makes it do nothing,
# without unloading it: samples then come only from the menu and `agents
# watch` while they run (`agents` says when none has run for 10 minutes).
# AGENTS_SAMPLER=1
# `agents report` shows what the tokens would cost at API list prices
# (API-equivalent: on a subscription you pay your plan, not this). The prices
# ship with agents (lib/tuidev/agents/prices.tsv, replaced on update); this
# file of yours changes or adds them, read after the shipped ones (USD per
# million tokens, one model per line: configs/agents/agents-prices.example.tsv
# in the tuidev repo). An absolute or ~/ path; off shows no cost at all.
# AGENTS_PRICES=~/.config/tuidev/agents-prices.tsv

# --- Job types: where the CPU goes --------------------------------------------

# Every process in an agent's tree counts toward one job: test, build, server,
# browser, mcp, agent (the CLIs), wait (polling loops) or other. A command and
# everything it starts share its job (go test and its test binaries are test).
# Each key below adds an extended regex (ERE) to that job's built-in patterns,
# matched against the command a session runs (or a process's command line).
# Quote it when it contains " #". Examples:
# AGENTS_JOB_TEST="(^| )(just|task) test( |$)"
# AGENTS_JOB_BUILD="(^| )(just|task) build( |$)"
# AGENTS_JOB_SERVER="(^| )foreman start( |$)"
# AGENTS_JOB_BROWSER="(^|/)my-headless-browser( |$)"
# AGENTS_JOB_MCP="(^|/)my-tools-server( |$)"
# 1 cleans up, without asking, only what is safe to: the leftovers of agent
# sessions that have ended, when a sample saw them under an agent (so it needs
# AGENTS_HISTORY=1; never a server or anything listening on a port: one an
# agent started for you may still be wanted; never a caffeinate without -t),
# and polling loops stuck for twice AGENTS_WAIT_STUCK reading a file that
# stayed quiet. Never a long command.
# The menu runs it at most once a minute; where no menu runs (Linux, a
# headless box, SwiftBar quit), the sampler does (AGENTS_SAMPLER).
# Each cleanup is logged and notified.
# 0 (the default) only lists them in the menu; `agents why PID` explains each.
# AGENTS_AUTO_REAP=0
# 1 (the default) lets the Claude Code cleanup hooks (`agents hook`, shipped in
# ~/.claude/settings.json) stop the background commands a subagent left running
# after handing back its report, and a cleared session's polling loops. Only
# tasks matched to their own process by its output file are touched. 0 turns
# them off.
# AGENTS_HOOK_REAP=1
# 1 logs each hook run (event, agent id, whether a handback was found, tasks,
# matches, dry run; never a command line) to hooks.log in the data directory,
# to check when the hooks fire on your machine. 0 (the default) logs nothing.
# AGENTS_HOOK_LOG=0

# --- Usage limits ---------------------------------------------------------------

# Claude Code tells its 5-hour and weekly limits (Pro and Max plans) only to
# its status line, so ~/.claude/settings.json ships `agents statusline` as
# the statusLine command: it records them for the menu and `agents limits`,
# then prints a compact line with a context gauge, which turns yellow at 70%
# and red at 90%. To keep
# a status line of your own, put its command here (quoted): it gets the same
# JSON on stdin, and what it prints is shown as is. If your settings.json
# already had a statusLine, it was kept: set statusLine's command to the
# shipped one (configs/claude/settings.json) and move yours here.
# Codex's limits come from its own logs, Antigravity's from `agy -p /quota`
# every 10 minutes (no tokens used); Grok and Cursor expose none locally.
# AGENTS_STATUSLINE_CMD="~/.claude/my-statusline.sh"

# 1 = don't ask Herdr for agent status.
# AGENTS_NO_HERDR=

# --- Other machines (`agents ports`, `agents forward`, `agents link`) -----------

# 1: follow your other machines (`agents link watch`; a LaunchAgent on macOS),
# so a Ctrl-click on a localhost link in one of their Herdr panes opens in
# this machine's browser through an ssh tunnel. 0: off. After a change here,
# run `agents link restart`.
# AGENTS_LINK=1
# ssh hosts that count as your machines besides the ones saved in Herdr
# (`herdr machine list`), space-separated.
# AGENTS_REMOTE_HOSTS="devbox workbox"

# The terminal that `agents open-term` (and the menu's "Open agents watch")
# opens: auto, ghostty (1.2 or later), iterm, terminal, wezterm or kitty. auto picks
# the first installed of Ghostty 1.2+, iTerm, WezTerm and kitty, else Terminal.
# Ghostty 1.3+ gets a new window of the instance you run (AppleScript).
# AGENTS_TERMINAL=auto

# --- Menu bar (SwiftBar, macOS) ------------------------------------------------

# What the title shows, in this order. Tokens:
#   triage   what needs you: how many sessions are blocked, then how many to
#            review; the icon alone when nothing does
#   count    number of agent sessions, how many blocked, how many done (hidden at 0)
#   cpu      machine CPU %          mem      memory used %
#   load     1-minute load average  battery  battery % (Macs with a battery)
#   thermal  thermal pressure, only when above nominal
#   temp     the SoC's temperature in °C (with --pack cooling)
#   awake    a cup while keep-awake is on
#   warn     a triangle when the machine needs a look (the icon is tinted anyway)
#   limit    the highest usage-limit % of any CLI (a gauge)
# Empty (AGENTS_BAR_TITLE=) shows the icon alone.
# AGENTS_BAR_TITLE="triage awake"

# Menu sections, in this order. needs: blocked sessions; review: finished, not
# looked at; running: working sessions, and duplicate, long-running or stuck
# commands; parked: one row, the sessions in its submenu; limits: a gauge per
# usage-limit window, its marker the time gone (and swap, while it is high); today:
# one row, its submenu holding where the CPU goes, tokens, denials, compactions
# and the report; machines: your other machines and every dev server, loaded when
# the menu opens (never on its timer); system: one row for CPU, memory and
# thermal pressure, the rest in its submenu. All but awake and system only appear when they have entries. The
# older names still work: agents (running and parked), usage (limits), jobs (today).
# AGENTS_BAR_SECTIONS="needs review running parked limits today stale hogs machines awake system"

# The mark in front of each kind of session, wherever one is listed (Herdr's
# tabs and sidebar, agents map, the menu bar): Claude Code ✳, Codex ⬡, Grok ✕,
# Antigravity ▲, Cursor ◈, any other agent ◆, a plain shell ❯. KIND=GLYPH words
# change single ones (a glyph is up to 8 characters, no space, | or =); "off"
# shows none.
# AGENTS_GLYPHS="codex=C shell=$"

# Herdr's labels (`agents herdr`): 1 names each tab after what runs in it
# (the mark, then the session's task title or the pane's directory), ends each
# workspace row in the sidebar with its sessions by kind ("✳2 ❯1") and marks
# agent rows. A tab you renamed is never touched. 0 leaves Herdr's labels
# alone; `agents herdr reset` puts back what a sync set.
# AGENTS_HERDR_NAMES=1

# Herdr's phone app (agents hc), experimental: 1 mirrors every agent pane of
# this machine's Herdr into herdr-core while one runs, so the phone lists the
# agents you already have. A pane takes its mirror's size, and the phone app
# sets that: while the phone shows one, the pane at your desk has the phone's
# size, and gets its own back when the phone stops. 0 (the default) mirrors
# nothing.
# AGENTS_HC_MIRROR=0

# With mirrors on: 1 (the default) gives a mirrored pane its own size back
# when you focus it at the desk, even while the phone still shows it (the
# phone then sees the pane's top left until it sets its size again); 0 leaves
# the size to the phone until it lets go. `agents hc mirror fit` fits by hand.
# AGENTS_HC_MIRROR_FIT=1

# The herdr-core pack's job (agents hc up -q), at login and every 5 minutes:
# 1 (the default) starts herdr-core again when it is not running; 0 starts
# nothing, so a core you stopped (herdr-core server stop) stays down.
# AGENTS_HC_UP=1

# Herdr's phone app, automatic hosting: 1 hosts a `claude` or `codex` you type
# in a Herdr pane in herdr-core by itself, as `agents hc run` would, so the
# phone lists it. It needs the herdr-core pack's shell fragment and a core
# that already runs (in your desktop login, on macOS); a start it cannot host
# (no core, `claude -p`, a subcommand, a prompt) runs as typed. A new shell
# picks up a change. 0 (the default) leaves every start alone.
# AGENTS_HC_AUTO=0

# The title's SF Symbol (any name from Apple's SF Symbols app).
# AGENTS_BAR_ICON=terminal

# How many of the busiest processes the system row's submenu lists (0 = none).
# Processes already listed as hogs are skipped.
# AGENTS_BAR_TOP=3

# The backstop: how often the menu bar refreshes when nothing asks it to
# (10s, 30s, 1m, 5m...). It refreshes on events anyway: Claude Code's hooks,
# Herdr's agent events and the menu opening (`agents bar poke`), every 10 s
# while a command runs or a session nothing else reports on works, and with
# nothing going on it skips its reading for up to 5 minutes. One refresh
# costs 0.2-0.6 s of CPU. SwiftBar reads it from the plugin's file name:
# re-run `./install.sh --pack monitoring` (or `make update-configs`) after
# changing it, and the pack renames the plugin to match.
# AGENTS_BAR_REFRESH=1m
